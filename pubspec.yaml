name: fitness
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.8.1 # For playing videos
  chewie: ^1.7.4 # For a customizable video player UI
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/images/
flutter_icons:
  android: true
  image_path: "assets/images/repcore.jpeg"
  adaptive_icon_background: "assets/images/repcore.jpeg"
